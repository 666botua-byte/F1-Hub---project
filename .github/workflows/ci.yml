name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    # 1. Додаємо сервіс PostgreSQL для тестів
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: f1hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ... (тут ваші існуючі кроки Checkout, Setup .NET, Restore, Build) ...

      - name: Test
        run: dotnet test --no-build
        # 2. Додаємо рядок підключення до тестової БД
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=f1hub_test;Username=postgres;Password=testpassword"
          Jwt__Key: ci-only-key-must-be-long-enough-for-testing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
